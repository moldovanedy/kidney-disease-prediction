[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kidney-disease-predictor"
version = "0.1.0"
description = "TensorFlow logistic regression with BigQuery ML deployment"
requires-python = ">=3.14,<3.15"
dependencies = [
    "google-cloud-bigquery>=3.20,<4",
    "google-cloud-storage>=2.16,<4",
    "numpy>=2.1,<3",
    "pandas>=2.2.3,<4",
    "tensorflow>=2.15,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
